<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Suivi</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Suivi">
<meta name="theme-color" content="#14161a">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2314161a'/%3E%3Ccircle cx='50' cy='50' r='28' fill='none' stroke='%237c9885' stroke-width='7'/%3E%3Ccircle cx='50' cy='22' r='6' fill='%237c9885'/%3E%3C/svg%3E">

<style>
  :root {
    --bg: #14161a;
    --bg-raised: #1c1f24;
    --line: #2a2e35;
    --ink: #e8e6e1;
    --ink-dim: #8b9099;
    --accent: #7c9885;
    --warn: #b3705f;
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font-body); min-height: 100vh; overscroll-behavior: none;
  }
  body { padding: max(24px, env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); }
  .wrap { max-width: 560px; margin: 0 auto; }

  .tabs {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px;
    margin-bottom: 20px; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; padding: 9px 16px; border-radius: 20px;
    background: var(--bg-raised); border: 1px solid var(--line);
    color: var(--ink-dim); font-size: 13px; font-weight: 600;
    white-space: nowrap; cursor: pointer;
  }
  .tab.active { background: var(--accent); color: #10130f; border-color: var(--accent); }
  .tab-add {
    flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%;
    background: var(--bg-raised); border: 1px solid var(--line);
    color: var(--ink-dim); font-size: 18px; display: flex;
    align-items: center; justify-content: center; cursor: pointer;
  }

  .hero { text-align: center; padding: 4px 0 20px; position: relative; }
  .hero .goal-name { font-size: 15px; color: var(--ink); font-weight: 600; margin-bottom: 14px; }
  .hero .label {
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-dim); margin-bottom: 10px;
  }
  .hero .count {
    font-family: var(--font-display); font-size: 76px; line-height: 1;
    color: var(--ink); font-variant-numeric: tabular-nums;
  }
  .hero .unit { font-size: 15px; color: var(--ink-dim); margin-top: 6px; }
  .hero .best { margin-top: 14px; font-size: 13px; color: var(--ink-dim); }
  .hero .best b { color: var(--accent); font-weight: 600; }
  .delete-goal {
    position: absolute; top: 4px; right: 0; font-size: 12px;
    color: var(--warn); background: none; border: none; cursor: pointer;
    padding: 6px; flex: none; width: auto;
  }

  .actions { display: flex; gap: 10px; margin: 0 0 30px; }
  button {
    font-family: var(--font-body); font-size: 14px; font-weight: 600;
    border: none; border-radius: 10px; padding: 14px 16px; cursor: pointer;
    flex: 1; transition: transform 0.08s ease;
  }
  button:active { transform: scale(0.97); }
  .btn-ok { background: var(--accent); color: #10130f; }
  .btn-ok:disabled { background: var(--bg-raised); color: var(--ink-dim); border: 1px solid var(--line); }
  .btn-reset { background: transparent; color: var(--warn); border: 1px solid var(--warn); }

  .panel {
    background: var(--bg-raised); border: 1px solid var(--line);
    border-radius: 14px; padding: 20px; margin-bottom: 18px;
  }
  .panel h3 {
    margin: 0 0 14px; font-size: 12px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-dim); font-weight: 600;
  }

  .grid { display: grid; grid-template-columns: repeat(15, 1fr); gap: 5px; }
  .cell { aspect-ratio: 1; border-radius: 4px; background: var(--line); }
  .cell.ok { background: var(--accent); }
  .cell.reset { background: var(--warn); }
  .cell.today { box-shadow: 0 0 0 2px var(--ink) inset; }

  .slider-row { margin-bottom: 16px; }
  .slider-row:last-child { margin-bottom: 0; }
  .slider-row label {
    display: flex; justify-content: space-between; font-size: 13px;
    color: var(--ink-dim); margin-bottom: 8px;
  }
  .slider-row label span.val { color: var(--accent); font-weight: 700; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; color: var(--ink); font-family: var(--font-body);
    font-size: 14px; padding: 10px; resize: vertical; min-height: 60px; margin-top: 4px;
  }
  .save-note { font-size: 12px; color: var(--ink-dim); margin-top: 10px; text-align: right; min-height: 16px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-dim); font-size: 14px; }
  .empty-state button { margin-top: 16px; max-width: 220px; margin-left: auto; margin-right: auto; }

  .backup-row { display: flex; gap: 10px; margin-top: 6px; }
  .backup-row button {
    background: transparent; border: 1px solid var(--line); color: var(--ink-dim); font-size: 13px;
  }
  .footer-note { text-align: center; font-size: 12px; color: var(--ink-dim); margin-top: 14px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">

  <div class="tabs" id="tabs"></div>

  <div id="content"></div>

  <div class="panel">
    <h3>Sauvegarde</h3>
    <div class="backup-row">
      <button id="btnExport">Exporter mes données</button>
      <button id="btnImport">Importer une sauvegarde</button>
    </div>
    <input type="file" id="fileInput" accept="application/json" style="display:none">
  </div>

  <div class="footer-note">
    Données stockées sur ce téléphone. Si tu remplaces ce fichier par une nouvelle version,
    exporte d'abord tes données puis réimporte-les dans le nouveau fichier.
  </div>
</div>

<script>
const STORAGE_KEY = 'multi-goal-tracker';
let data = { goals: {}, order: [], active: null };
let saveTimer = null;

function uid() { return 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function todayStr(offset = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toISOString().slice(0, 10);
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.goals) data = parsed;
    }
  } catch (e) { /* keep defaults */ }

  if (data.order.length === 0) {
    const g1 = uid(), g2 = uid();
    data.goals[g1] = { name: 'Pas se branler', days: {} };
    data.goals[g2] = { name: 'Pas de sucre', days: {} };
    data.order = [g1, g2];
    data.active = g1;
    persist();
  }
  if (!data.active || !data.goals[data.active]) data.active = data.order[0] || null;

  render();
}

function persist() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
  catch (e) { console.error('Storage error:', e); }
}

function computeStreak(goal) {
  let streak = 0, i = 0;
  while (true) {
    const day = todayStr(-i);
    const entry = goal.days[day];
    if (entry && entry.status === 'reset') break;
    if (entry && entry.status === 'ok') { streak++; i++; continue; }
    if (i === 0) { i++; continue; }
    break;
  }
  return streak;
}

function computeBest(goal) {
  const dates = Object.keys(goal.days).sort();
  let best = 0, cur = 0;
  for (const d of dates) {
    if (goal.days[d].status === 'ok') { cur++; best = Math.max(best, cur); }
    else if (goal.days[d].status === 'reset') { cur = 0; }
  }
  return Math.max(best, computeStreak(goal));
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  data.order.forEach(id => {
    const goal = data.goals[id];
    const tab = document.createElement('div');
    tab.className = 'tab' + (id === data.active ? ' active' : '');
    tab.textContent = goal.name;
    tab.addEventListener('click', () => { data.active = id; persist(); render(); });
    tabs.appendChild(tab);
  });
  const add = document.createElement('div');
  add.className = 'tab-add';
  add.textContent = '+';
  add.addEventListener('click', addGoal);
  tabs.appendChild(add);
}

function addGoal() {
  const name = prompt("Nom de l'objectif (ex: Pas de sucre, Pas d'écran le soir...)");
  if (!name || !name.trim()) return;
  const id = uid();
  data.goals[id] = { name: name.trim(), days: {} };
  data.order.push(id);
  data.active = id;
  persist();
  render();
}

function deleteGoal(id) {
  const goal = data.goals[id];
  if (!confirm(`Supprimer "${goal.name}" et tout son historique ?`)) return;
  delete data.goals[id];
  data.order = data.order.filter(x => x !== id);
  data.active = data.order[0] || null;
  persist();
  render();
}

function renderContent() {
  const content = document.getElementById('content');
  content.innerHTML = '';

  if (!data.active || !data.goals[data.active]) {
    content.innerHTML = `<div class="empty-state">Aucun objectif pour l'instant.<br>Ajoute-en un avec le bouton "+".</div>`;
    return;
  }

  const goal = data.goals[data.active];
  const streak = computeStreak(goal);
  const best = computeBest(goal);
  const today = todayStr(0);
  const todayEntry = goal.days[today];

  content.innerHTML = `
    <div class="hero">
      <button class="delete-goal" id="btnDeleteGoal">Supprimer</button>
      <div class="goal-name">${escapeHtml(goal.name)}</div>
      <div class="label">Streak actuel</div>
      <div class="count">${streak}</div>
      <div class="unit">${streak <= 1 ? 'jour' : 'jours'}</div>
      <div class="best">${best > 0 ? `Record : <b>${best}</b> jour${best > 1 ? 's' : ''}` : ''}</div>
    </div>

    <div class="actions">
      <button class="btn-ok" id="btnOk" ${todayEntry ? 'disabled' : ''}>${todayEntry ? 'Jour déjà noté' : 'Jour validé'}</button>
      <button class="btn-reset" id="btnReset">Reset</button>
    </div>

    <div class="panel">
      <h3>90 derniers jours</h3>
      <div class="grid" id="grid"></div>
    </div>

    <div class="panel">
      <h3>Aujourd'hui</h3>
      <div class="slider-row">
        <label>Énergie <span class="val" id="energyVal">–</span></label>
        <input type="range" min="1" max="10" id="energySlider" ${!todayEntry ? 'disabled' : ''}>
      </div>
      <div class="slider-row">
        <label>Focus <span class="val" id="focusVal">–</span></label>
        <input type="range" min="1" max="10" id="focusSlider" ${!todayEntry ? 'disabled' : ''}>
      </div>
      <div class="slider-row">
        <label>Note</label>
        <textarea id="noteText" placeholder="Optionnel..." ${!todayEntry ? 'disabled' : ''}></textarea>
      </div>
      <div class="save-note" id="saveNote"></div>
    </div>
  `;

  const grid = document.getElementById('grid');
  for (let i = 89; i >= 0; i--) {
    const d = todayStr(-i);
    const entry = goal.days[d];
    const cell = document.createElement('div');
    cell.className = 'cell';
    if (entry && entry.status === 'ok') cell.className += ' ok';
    if (entry && entry.status === 'reset') cell.className += ' reset';
    if (d === today) cell.className += ' today';
    cell.title = d;
    grid.appendChild(cell);
  }

  const energySlider = document.getElementById('energySlider');
  const focusSlider = document.getElementById('focusSlider');
  const noteText = document.getElementById('noteText');
  if (todayEntry) {
    energySlider.value = todayEntry.energy || 5;
    focusSlider.value = todayEntry.focus || 5;
    noteText.value = todayEntry.note || '';
  }
  document.getElementById('energyVal').textContent = todayEntry ? energySlider.value : '–';
  document.getElementById('focusVal').textContent = todayEntry ? focusSlider.value : '–';

  document.getElementById('btnDeleteGoal').addEventListener('click', () => deleteGoal(data.active));
  document.getElementById('btnOk').addEventListener('click', () => markToday('ok'));
  document.getElementById('btnReset').addEventListener('click', () => {
    if (confirm('Confirmer le reset du streak ?')) markToday('reset');
  });
  energySlider.addEventListener('input', (e) => {
    document.getElementById('energyVal').textContent = e.target.value;
    scheduleSave();
  });
  focusSlider.addEventListener('input', (e) => {
    document.getElementById('focusVal').textContent = e.target.value;
    scheduleSave();
  });
  noteText.addEventListener('input', scheduleSave);
}

function render() {
  renderTabs();
  renderContent();
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function markToday(status) {
  const goal = data.goals[data.active];
  const today = todayStr(0);
  goal.days[today] = goal.days[today] || {};
  goal.days[today].status = status;
  if (status === 'ok') {
    goal.days[today].energy = goal.days[today].energy || 5;
    goal.days[today].focus = goal.days[today].focus || 5;
  }
  persist();
  render();
}

function scheduleSave() {
  clearTimeout(saveTimer);
  const note = document.getElementById('saveNote');
  if (note) note.textContent = '...';
  saveTimer = setTimeout(() => {
    const goal = data.goals[data.active];
    const today = todayStr(0);
    if (!goal.days[today]) return;
    goal.days[today].energy = parseInt(document.getElementById('energySlider').value);
    goal.days[today].focus = parseInt(document.getElementById('focusSlider').value);
    goal.days[today].note = document.getElementById('noteText').value;
    persist();
    const n = document.getElementById('saveNote');
    if (n) { n.textContent = 'Enregistré'; setTimeout(() => { if (n) n.textContent = ''; }, 1500); }
  }, 500);
}

document.getElementById('btnExport').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `suivi-sauvegarde-${todayStr(0)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

document.getElementById('btnImport').addEventListener('click', () => {
  document.getElementById('fileInput').click();
});

document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const parsed = JSON.parse(evt.target.result);
      if (!parsed.goals || !parsed.order) throw new Error('format invalide');
      if (!confirm('Importer cette sauvegarde ? Ça remplacera les données actuelles.')) return;
      data = parsed;
      persist();
      render();
    } catch (err) {
      alert("Fichier invalide, impossible d'importer.");
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

loadData();
</script>
</body>
</html>
